name: Build GymMane APK

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true

    - name: Mostrar versiones
      run: flutter --version

    - name: Instalar dependencias
      run: flutter pub get

    - name: Configurar Keystore de Firma
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/gymmane.jks
        cat <<EOF > android/key.properties
        storePassword=gymmane123
        keyPassword=gymmane123
        keyAlias=gymmanekey
        storeFile=gymmane.jks
        EOF

    - name: Compilar APKs (Release Split)
      run: flutter build apk --release --split-per-abi

    - name: Renombrar APKs
      run: |
        cd build/app/outputs/flutter-apk
        cp app-arm64-v8a-release.apk GymMane-arm64-v8a.apk
        cp app-armeabi-v7a-release.apk GymMane-armeabi-v7a.apk
        cp app-x86_64-release.apk GymMane-x86_64.apk
        cp app-arm64-v8a-release.apk app-release.apk

    - name: Subir APKs generados
      uses: actions/upload-artifact@v4
      with:
        name: XaviGymMane-Update-APK
        path: build/app/outputs/flutter-apk/*.apk
        if-no-files-found: error
